  <!DOCTYPE html>
<html lang="ja" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>木版画工房 - Mokuhanga Studio</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts for Authentic Japanese Feel -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Yuji+Syuku&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        wood: {
                            50: '#fdfbf7',
                            100: '#f6f0e4',
                            200: '#ebd9c1',
                            300: '#dcbe97',
                            400: '#cc9e6d',
                            500: '#b87e45',
                            600: '#996035',
                            700: '#7a482b',
                            800: '#5c3522',
                            900: '#3e2217',
                        },
                        sumi: '#1c1b1a',
                        shu: '#c03529',
                        ai: '#1b365d',
                        uguisu: '#5b6b44',
                        yamabuki: '#e59b27',
                        washi: '#f7f4ea'
                    },
                    fontFamily: {
                        mincho: ['"Shippori Mincho"', 'serif'],
                        yuji: ['"Yuji Syuku"', 'serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Shippori Mincho', serif;
            background-color: #2a2421;
            background-image: radial-gradient(#3a322d 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .washi-texture {
            background-color: #f7f4ea;
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M11 18c3.86 0 7-3.14 7-7s-3.14-7-7-7-7 3.14-7 7 3.14 7 7 7zm48 25c3.86 0 7-3.14 7-7s-3.14-7-7-7-7 3.14-7 7 3.14 7 7 7zm-43-7c1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3 1.34 3 3 3zm63 31c1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3 1.34 3 3 3zM34 90c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm56-67c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zM12 86c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm28-65c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm23-11c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-6 60c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm29 22c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5z' fill='%208c7c6d' fill-opacity='0.05' fill-rule='evenodd'/%3E%3C/svg%3E");
        }

        .wood-texture {
            background-color: #a67c52;
            background-image: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0, 0, 0, 0.05) 3px, rgba(0, 0, 0, 0.05) 6px);
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #2a2421;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #7a482b;
            border-radius: 3px;
        }

        /* Tool cursor indicators */
        .cursor-chisel { cursor: crosshair; }
        .cursor-baren { cursor: grab; }
        .cursor-baren:active { cursor: grabbing; }

        /* Japanese Stamp Seal Effect */
        .hanko-seal {
            border: 2px solid #c03529;
            color: #c03529;
            border-radius: 4px;
            padding: 2px 6px;
            font-family: 'Yuji Syuku', serif;
            display: inline-block;
            transform: rotate(-3deg);
        }
    </style>
</head>
<body class="h-full flex flex-col text-slate-200 select-none overflow-x-hidden">

    <header class="bg-wood-900 border-b border-wood-700 px-6 py-3 flex flex-wrap items-center justify-between shadow-lg">
        <div class="flex items-center space-x-4">
            <div class="w-10 h-10 rounded-lg bg-shu text-washi flex items-center justify-center font-bold text-2xl shadow-md border border-red-800">
                刻
            </div>
            <div>
                <h1 class="text-xl md:text-2xl font-bold tracking-widest text-wood-100 flex items-center gap-2">
                    木版画工房 <span class="text-xs text-wood-300 font-normal px-2 py-0.5 rounded bg-wood-800 border border-wood-600">Mokuhanga Studio</span>
                </h1>
                <p class="text-xs text-wood-400">江戸の伝統技術とデジタルアートの融合</p>
            </div>
        </div>

        <!-- Mode Selector Tabs -->
        <div class="flex items-center space-x-2 mt-2 sm:mt-0 bg-wood-950 p-1 rounded-xl border border-wood-800">
            <button id="mode-carve-btn" onclick="switchMode('carve')" class="px-4 py-1.5 rounded-lg text-sm font-semibold transition-all flex items-center gap-2 bg-wood-700 text-white shadow">
                <i class="fa-solid fa-cut"></i> 版刻・手彫り刷り
            </button>
            <button id="mode-convert-btn" onclick="switchMode('convert')" class="px-4 py-1.5 rounded-lg text-sm font-semibold transition-all flex items-center gap-2 text-wood-400 hover:text-white">
                <i class="fa-solid fa-wand-magic-sparkles"></i> 写真・絵画 浮世絵変換
            </button>
        </div>

        <div class="flex items-center space-x-3 mt-2 sm:mt-0">
            <button onclick="toggleAudio()" id="audio-btn" class="p-2 rounded-lg bg-wood-800 hover:bg-wood-700 text-wood-200 border border-wood-700 text-sm transition" title="効果音切り替え">
                <i class="fa-solid fa-volume-high"></i>
            </button>
            <button onclick="downloadArtwork()" class="px-4 py-1.5 rounded-lg bg-shu hover:bg-red-700 text-white font-bold text-sm shadow transition flex items-center gap-2 border border-red-800">
                <i class="fa-solid fa-download"></i> 完成画を保存
            </button>
        </div>
    </header>

    <main class="flex-1 flex flex-col md:flex-row overflow-hidden relative">
        
        <!-- LEFT CONTROL PANEL (Tools / Converter Controls) -->
        <aside class="w-full md:w-80 bg-wood-900 border-r border-wood-800 flex flex-col z-10 custom-scrollbar overflow-y-auto">
            
            <!-- MODE 1 CONTROLS: DIGITAL CARVING -->
            <div id="carve-controls" class="p-4 space-y-5">
                <!-- Chisel Selection -->
                <div>
                    <h3 class="text-xs font-bold text-wood-300 uppercase tracking-wider mb-2 flex items-center gap-2">
                        <i class="fa-solid fa-toolbox text-yamabuki"></i> 彫刻刀・工具選択
                    </h3>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="setTool('v_gouge')" id="tool-v_gouge" class="tool-btn active flex items-center gap-2 p-2.5 rounded-lg border bg-wood-800 border-yamabuki text-white text-xs font-medium hover:bg-wood-700 transition">
                            <i class="fa-solid fa-v text-yamabuki text-sm"></i> 三角刀 (細線)
                        </button>
                        <button onclick="setTool('round_gouge')" id="tool-round_gouge" class="tool-btn flex items-center gap-2 p-2.5 rounded-lg border bg-wood-800 border-wood-700 text-wood-300 text-xs font-medium hover:bg-wood-700 transition">
                            <i class="fa-solid fa-circle-notch text-sm"></i> 丸刀 (広彫り)
                        </button>
                        <button onclick="setTool('flat_chisel')" id="tool-flat_chisel" class="tool-btn flex items-center gap-2 p-2.5 rounded-lg border bg-wood-800 border-wood-700 text-wood-300 text-xs font-medium hover:bg-wood-700 transition">
                            <i class="fa-solid fa-vector-square text-sm"></i> 平刀 (面削り)
                        </button>
                        <button onclick="setTool('kiri_chisel')" id="tool-kiri_chisel" class="tool-btn flex items-center gap-2 p-2.5 rounded-lg border bg-wood-800 border-wood-700 text-wood-300 text-xs font-medium hover:bg-wood-700 transition">
                            <i class="fa-solid fa-pen-nib text-sm"></i> 印刀 (輪郭切込み)
                        </button>
                        <button onclick="setTool('roller')" id="tool-roller" class="tool-btn col-span-2 flex items-center justify-center gap-2 p-2.5 rounded-lg border bg-wood-800 border-wood-700 text-wood-300 text-xs font-medium hover:bg-wood-700 transition">
                            <i class="fa-solid fa-paint-roller text-shu text-sm"></i> 版木インク着色ローラー
                        </button>
                        <button onclick="setTool('baren')" id="tool-baren" class="tool-btn col-span-2 flex items-center justify-center gap-2 p-2.5 rounded-lg border bg-wood-800 border-wood-700 text-wood-300 text-xs font-medium hover:bg-wood-700 transition">
                            <i class="fa-solid fa-hand-holding-hand text-yamabuki text-sm"></i> 馬連 (Baren) 擦り込み
                        </button>
                    </div>
                </div>

                <!-- Tool Size Slider -->
                <div>
                    <div class="flex justify-between text-xs text-wood-300 font-semibold mb-1">
                        <span>刃の太さ / 工具サイズ</span>
                        <span id="tool-size-val" class="text-yamabuki">5 px</span>
                    </div>
                    <input type="range" id="tool-size" min="1" max="40" value="5" oninput="updateToolSize(this.value)" class="w-full accent-yamabuki bg-wood-950 h-2 rounded-lg cursor-pointer">
                </div>

                <!-- Traditional Color Palette -->
                <div>
                    <h3 class="text-xs font-bold text-wood-300 uppercase tracking-wider mb-2 flex items-center gap-2">
                        <i class="fa-solid fa-palette text-shu"></i> 伝統和色インクパレット
                    </h3>
                    <div class="grid grid-cols-4 gap-2">
                        <button onclick="setColor('#1c1b1a', '墨 Sumi')" class="color-btn flex flex-col items-center p-2 rounded-lg border border-wood-700 bg-wood-950 hover:scale-105 transition active-color" style="border-color: #1c1b1a;">
                            <span class="w-6 h-6 rounded-full border border-gray-600 mb-1" style="background-color: #1c1b1a;"></span>
                            <span class="text-[10px] text-wood-200">墨</span>
                        </button>
                        <button onclick="setColor('#c03529', '朱 Shu')" class="color-btn flex flex-col items-center p-2 rounded-lg border border-wood-700 bg-wood-950 hover:scale-105 transition">
                            <span class="w-6 h-6 rounded-full border border-gray-600 mb-1" style="background-color: #c03529;"></span>
                            <span class="text-[10px] text-wood-200">朱赤</span>
                        </button>
                        <button onclick="setColor('#1b365d', '藍 Ai')" class="color-btn flex flex-col items-center p-2 rounded-lg border border-wood-700 bg-wood-950 hover:scale-105 transition">
                            <span class="w-6 h-6 rounded-full border border-gray-600 mb-1" style="background-color: #1b365d;"></span>
                            <span class="text-[10px] text-wood-200">藍</span>
                        </button>
                        <button onclick="setColor('#5b6b44', '鶯 Uguisu')" class="color-btn flex flex-col items-center p-2 rounded-lg border border-wood-700 bg-wood-950 hover:scale-105 transition">
                            <span class="w-6 h-6 rounded-full border border-gray-600 mb-1" style="background-color: #5b6b44;"></span>
                            <span class="text-[10px] text-wood-200">鶯</span>
                        </button>
                        <button onclick="setColor('#e59b27', '山吹 Yamabuki')" class="color-btn flex flex-col items-center p-2 rounded-lg border border-wood-700 bg-wood-950 hover:scale-105 transition">
                            <span class="w-6 h-6 rounded-full border border-gray-600 mb-1" style="background-color: #e59b27;"></span>
                            <span class="text-[10px] text-wood-200">山吹</span>
                        </button>
                        <button onclick="setColor('#7a482b', '代赭 Taisha')" class="color-btn flex flex-col items-center p-2 rounded-lg border border-wood-700 bg-wood-950 hover:scale-105 transition">
                            <span class="w-6 h-6 rounded-full border border-gray-600 mb-1" style="background-color: #7a482b;"></span>
                            <span class="text-[10px] text-wood-200">代赭</span>
                        </button>
                        <button onclick="setColor('#f7f4ea', '胡粉 Gofun')" class="color-btn flex flex-col items-center p-2 rounded-lg border border-wood-700 bg-wood-950 hover:scale-105 transition">
                            <span class="w-6 h-6 rounded-full border border-gray-600 mb-1" style="background-color: #f7f4ea;"></span>
                            <span class="text-[10px] text-wood-200">胡粉</span>
                        </button>
                        <div class="flex flex-col items-center justify-center p-1">
                            <input type="color" id="custom-color-picker" value="#991b1b" onchange="setColor(this.value, 'カスタム')" class="w-7 h-7 rounded cursor-pointer bg-transparent border-none">
                            <span class="text-[9px] text-wood-400 mt-1">カスタム</span>
                        </div>
                    </div>
                </div>

                <!-- Woodblock Actions -->
                <div class="pt-2 border-t border-wood-800 space-y-2">
                    <button onclick="autoFillInk()" class="w-full py-2 bg-wood-800 hover:bg-wood-700 text-wood-200 text-xs font-bold rounded-lg border border-wood-700 transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-fill-drip"></i> 選択色で版木全体をインク塗り
                    </button>
                    <button onclick="clearCurrentBlock()" class="w-full py-2 bg-wood-950 hover:bg-red-950 text-red-400 text-xs font-bold rounded-lg border border-red-900/50 transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-rotate-left"></i> 現在の版木をリセット
                    </button>
                </div>
            </div>

            <!-- MODE 2 CONTROLS: PHOTO CONVERTER (Hidden by default) -->
            <div id="convert-controls" class="p-4 space-y-5 hidden">
                <!-- Preset Sample Selector -->
                <div>
                    <h3 class="text-xs font-bold text-wood-300 uppercase tracking-wider mb-2 flex items-center gap-2">
                        <i class="fa-solid fa-image text-yamabuki"></i> サンプル原画 / 画像アップロード
                    </h3>
                    <div class="grid grid-cols-3 gap-2 mb-3">
                        <button onclick="loadPreset('fuji')" class="p-1 rounded bg-wood-800 hover:bg-wood-700 border border-wood-700 text-center">
                            <div class="h-12 bg-cover bg-center rounded mb-1" style="background-image: url('https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?w=200&q=80');"></div>
                            <span class="text-[10px] text-wood-200">赤富士</span>
                        </button>
                        <button onclick="loadPreset('wave')" class="p-1 rounded bg-wood-800 hover:bg-wood-700 border border-wood-700 text-center">
                            <div class="h-12 bg-cover bg-center rounded mb-1" style="background-image: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=200&q=80');"></div>
                            <span class="text-[10px] text-wood-200">大海波</span>
                        </button>
                        <button onclick="loadPreset('cat')" class="p-1 rounded bg-wood-800 hover:bg-wood-700 border border-wood-700 text-center">
                            <div class="h-12 bg-cover bg-center rounded mb-1" style="background-image: url('https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=200&q=80');"></div>
                            <span class="text-[10px] text-wood-200">黒猫</span>
                        </button>
                    </div>

                    <label class="w-full py-2 bg-wood-800 hover:bg-wood-700 text-wood-200 text-xs font-bold rounded-lg border border-wood-600 border-dashed cursor-pointer flex items-center justify-center gap-2 transition">
                        <i class="fa-solid fa-upload text-yamabuki"></i> お手持ちの画像を読み込む
                        <input type="file" id="image-upload" accept="image/*" onchange="handleImageUpload(event)" class="hidden">
                    </label>
                </div>

                <!-- Woodcut Filter Adjustments -->
                <div class="space-y-4 pt-2 border-t border-wood-800">
                    <h3 class="text-xs font-bold text-wood-300 uppercase tracking-wider flex items-center gap-2">
                        <i class="fa-solid fa-sliders text-shu"></i> 版画化パラメータ調整
                    </h3>

                    <div>
                        <div class="flex justify-between text-xs text-wood-300 mb-1">
                            <span>墨彫り(主版) 輪郭強調</span>
                            <span id="contour-val" class="text-yamabuki">50</span>
                        </div>
                        <input type="range" id="param-contour" min="10" max="100" value="50" oninput="processPhotoWoodcut()" class="w-full accent-yamabuki bg-wood-950 h-2 rounded-lg cursor-pointer">
                    </div>

                    <div>
                        <div class="flex justify-between text-xs text-wood-300 mb-1">
                            <span>色版の数 (色数分解)</span>
                            <span id="colors-val" class="text-yamabuki">4 色</span>
                        </div>
                        <input type="range" id="param-colors" min="2" max="6" value="4" step="1" oninput="processPhotoWoodcut()" class="w-full accent-yamabuki bg-wood-950 h-2 rounded-lg cursor-pointer">
                    </div>

                    <div>
                        <div class="flex justify-between text-xs text-wood-300 mb-1">
                            <span>彫り味 (彫り彫刻テクスチャ)</span>
                            <span id="carve-depth-val" class="text-yamabuki">30</span>
                        </div>
                        <input type="range" id="param-carve-depth" min="0" max="80" value="30" oninput="processPhotoWoodcut()" class="w-full accent-yamabuki bg-wood-950 h-2 rounded-lg cursor-pointer">
                    </div>

                    <div>
                        <div class="flex justify-between text-xs text-wood-300 mb-1">
                            <span>木目・かすれ強度</span>
                            <span id="grain-val" class="text-yamabuki">40</span>
                        </div>
                        <input type="range" id="param-grain" min="0" max="100" value="40" oninput="processPhotoWoodcut()" class="w-full accent-yamabuki bg-wood-950 h-2 rounded-lg cursor-pointer">
                    </div>

                    <div>
                        <div class="flex justify-between text-xs text-wood-300 mb-1">
                            <span>和紙インク滲み (Bleed)</span>
                            <span id="bleed-val" class="text-yamabuki">2 px</span>
                        </div>
                        <input type="range" id="param-bleed" min="0" max="8" value="2" oninput="processPhotoWoodcut()" class="w-full accent-yamabuki bg-wood-950 h-2 rounded-lg cursor-pointer">
                    </div>
                </div>
            </div>

            <!-- Global Paper & Stamp Settings -->
            <div class="p-4 bg-wood-950 border-t border-wood-800 mt-auto space-y-3">
                <h3 class="text-xs font-bold text-wood-400 uppercase tracking-wider flex items-center gap-2">
                    <i class="fa-solid fa-scroll text-wood-300"></i> 和紙 & 落款 (印章)
                </h3>
                
                <div class="grid grid-cols-2 gap-2">
                    <select id="washi-type" onchange="updateWashiTexture()" class="bg-wood-900 border border-wood-700 text-wood-200 text-xs rounded-lg p-2">
                        <option value="echizen">越前生漉和紙 (標準)</option>
                        <option value="torinoko">鳥の子紙 (滑らか)</option>
                        <option value="hosokawa">細川紙 (風合い強)</option>
                        <option value="aged">古色和紙 (ビンテージ)</option>
                    </select>
                    
                    <button onclick="toggleHankoSeal()" id="hanko-btn" class="px-2 py-1.5 bg-wood-800 border border-wood-700 text-shu text-xs font-bold rounded-lg hover:bg-wood-700 transition flex items-center justify-center gap-1">
                        <span class="hanko-seal text-[9px]">極</span> 落款印 ON
                    </button>
                </div>
            </div>
        </aside>

        <!-- CENTER CANVAS WORKSPACE -->
        <section class="flex-1 flex flex-col bg-slate-950 relative overflow-hidden">
            
            <!-- Layer / View Switcher Toolbar -->
            <div class="bg-wood-900/90 backdrop-blur border-b border-wood-800 px-4 py-2 flex items-center justify-between z-10">
                <div class="flex items-center space-x-2 custom-scrollbar overflow-x-auto">
                    <span class="text-xs font-bold text-wood-400 whitespace-nowrap">版木レイヤー:</span>
                    <button onclick="selectBlock('final')" id="tab-final" class="block-tab px-3 py-1 rounded-md text-xs font-bold bg-yamabuki text-wood-900 shadow transition whitespace-nowrap">
                        <i class="fa-solid fa-layer-group"></i> 完成和紙刷り (Print View)
                    </button>
                    <button onclick="selectBlock('sumi')" id="tab-sumi" class="block-tab px-3 py-1 rounded-md text-xs font-medium text-wood-300 hover:bg-wood-800 transition whitespace-nowrap">
                        <span class="w-2.5 h-2.5 rounded-full inline-block bg-sumi border border-gray-400 mr-1"></span> 主版 (墨線)
                    </button>
                    <button onclick="selectBlock('color1')" id="tab-color1" class="block-tab px-3 py-1 rounded-md text-xs font-medium text-wood-300 hover:bg-wood-800 transition whitespace-nowrap">
                        <span class="w-2.5 h-2.5 rounded-full inline-block bg-shu mr-1"></span> 色版一 (朱)
                    </button>
                    <button onclick="selectBlock('color2')" id="tab-color2" class="block-tab px-3 py-1 rounded-md text-xs font-medium text-wood-300 hover:bg-wood-800 transition whitespace-nowrap">
                        <span class="w-2.5 h-2.5 rounded-full inline-block bg-ai mr-1"></span> 色版二 (藍)
                    </button>
                    <button onclick="selectBlock('color3')" id="tab-color3" class="block-tab px-3 py-1 rounded-md text-xs font-medium text-wood-300 hover:bg-wood-800 transition whitespace-nowrap">
                        <span class="w-2.5 h-2.5 rounded-full inline-block bg-uguisu mr-1"></span> 色版三 (鶯)
                    </button>
                </div>

                <div class="flex items-center space-x-2">
                    <button onclick="resetZoom()" class="p-1.5 text-xs text-wood-400 hover:text-white" title="拡大率リセット">
                        <i class="fa-solid fa-compress"></i> 100%
                    </button>
                </div>
            </div>

            <!-- Canvas Container -->
            <div id="canvas-container" class="flex-1 relative flex items-center justify-center p-4 overflow-auto custom-scrollbar">
                
                <!-- Main Canvas Overlay Frame -->
                <div class="relative shadow-2xl rounded-sm p-4 bg-wood-900 border-8 border-wood-800 flex items-center justify-center" id="frame-wrapper">
                    <!-- Traditional Kento Registration Mark Visual Guide -->
                    <div class="absolute top-1 left-1 w-4 h-4 border-t-2 border-l-2 border-yamabuki/40 pointer-events-none" title="見当 (Kento Mark)"></div>
                    <div class="absolute bottom-1 left-1 w-6 h-4 border-b-2 border-l-2 border-yamabuki/40 pointer-events-none" title="鍵見当"></div>

                    <!-- The Main Canvas -->
                    <canvas id="main-canvas" width="800" height="600" class="washi-texture shadow-inner cursor-chisel transition-transform duration-75"></canvas>

                    <!-- Interactive Baren Rubbing Feedback Overlay -->
                    <div id="baren-cursor-overlay" class="absolute pointer-events-none w-16 h-16 rounded-full border-2 border-yamabuki/60 bg-yamabuki/20 hidden flex items-center justify-center transform -translate-x-1/2 -translate-y-1/2">
                        <i class="fa-solid fa-arrows-spin text-yamabuki animate-spin text-sm"></i>
                    </div>
                </div>

                <!-- Toast Notification Box -->
                <div id="toast" class="absolute bottom-6 left-1/2 transform -translate-x-1/2 bg-wood-900/95 border border-yamabuki/60 text-wood-100 px-5 py-2.5 rounded-full shadow-2xl text-xs flex items-center gap-2 pointer-events-none opacity-0 transition-opacity duration-300 z-30">
                    <i class="fa-solid fa-circle-info text-yamabuki"></i> <span id="toast-msg">主版に彫り込みを開始できます</span>
                </div>
            </div>

            <!-- Bottom Information / Status Bar -->
            <div class="bg-wood-950 border-t border-wood-900 px-4 py-1.5 text-[11px] text-wood-400 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <span id="current-status-text"><i class="fa-solid fa-info-circle"></i> 彫刻刀で木版を削り、インクを載せて刷り上げましょう</span>
                </div>
                <div class="flex items-center gap-4 font-mono text-[10px]">
                    <span id="pos-display">X: 0, Y: 0</span>
                    <span>800 x 600 px</span>
                </div>
            </div>
        </section>
    </main>

    <script>
        // Global Application State
        let currentMode = 'carve'; // 'carve' or 'convert'
        let activeBlockKey = 'sumi'; // 'final', 'sumi', 'color1', 'color2', 'color3'
        let currentTool = 'v_gouge'; // 'v_gouge', 'round_gouge', 'flat_chisel', 'kiri_chisel', 'roller', 'baren'
        let toolSize = 5;
        let currentColor = '#1c1b1a';
        let colorName = '墨 Sumi';
        let showHanko = true;
        let audioEnabled = true;

        // Audio Context (Web Audio API for carving and baren sounds)
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
        }

        function playSound(type) {
            if (!audioEnabled) return;
            try {
                initAudio();
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const bufferSize = audioCtx.sampleRate * 0.08;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);

                if (type === 'carve') {
                    // Scratchy wood carving noise
                    for (let i = 0; i < bufferSize; i++) {
                        data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.5));
                    }
                    const noise = audioCtx.createBufferSource();
                    noise.buffer = buffer;

                    const filter = audioCtx.createBiquadFilter();
                    filter.type = 'bandpass';
                    filter.frequency.value = 1800 + Math.random() * 600;
                    filter.Q.value = 3;

                    noise.connect(filter);
                    filter.connect(audioCtx.destination);
                    noise.start();
                } else if (type === 'baren') {
                    // Low muffled rubbing swoosh sound
                    for (let i = 0; i < bufferSize; i++) {
                        data[i] = (Math.random() * 2 - 1) * 0.3;
                    }
                    const noise = audioCtx.createBufferSource();
                    noise.buffer = buffer;

                    const filter = audioCtx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.value = 400 + Math.random() * 200;

                    noise.connect(filter);
                    filter.connect(audioCtx.destination);
                    noise.start();
                }
            } catch (e) {
                // Audio not supported or blocked
            }
        }

        function toggleAudio() {
            audioEnabled = !audioEnabled;
            const btn = document.getElementById('audio-btn');
            btn.innerHTML = audioEnabled ? '<i class="fa-solid fa-volume-high"></i>' : '<i class="fa-solid fa-volume-xmark text-red-400"></i>';
            showToast(audioEnabled ? "効果音: オン" : "効果音: オフ");
        }

        // Canvas Setup
        const mainCanvas = document.getElementById('main-canvas');
        const mainCtx = mainCanvas.getContext('2d');
        const width = 800;
        const height = 600;

        // Offscreen Canvases for each Woodblock
        // Each block stores: carved wood cutouts (alpha cut) & ink layer
        const blocks = {
            sumi: { color: '#1c1b1a', name: '主版 (墨)' },
            color1: { color: '#c03529', name: '色版一 (朱)' },
            color2: { color: '#1b365d', name: '色版二 (藍)' },
            color3: { color: '#5b6b44', name: '色版三 (鶯)' }
        };

        // Create canvas contexts for each block
        Object.keys(blocks).forEach(key => {
            const blockCanvas = document.createElement('canvas');
            blockCanvas.width = width;
            blockCanvas.height = height;
            const ctx = blockCanvas.getContext('2d');
            
            // Fill initial wood surface
            ctx.fillStyle = blocks[key].color;
            ctx.fillRect(0, 0, width, height);

            blocks[key].canvas = blockCanvas;
            blocks[key].ctx = ctx;

            // Baren impression layer for this block (0 to 1 opacity mask)
            const barenCanvas = document.createElement('canvas');
            barenCanvas.width = width;
            barenCanvas.height = height;
            const bCtx = barenCanvas.getContext('2d');
            bCtx.fillStyle = '#ffffff'; // Fully pressed by default in convert mode, unpressed in manual mode
            bCtx.fillRect(0, 0, width, height);
            
            blocks[key].barenCanvas = barenCanvas;
            blocks[key].barenCtx = bCtx;
        });

        // Photo Converter Source Image Storage
        let loadedSourceImage = null;

        // Carving state
        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;

        // Initialize Canvas listeners
        mainCanvas.addEventListener('mousedown', startDrawing);
        mainCanvas.addEventListener('mousemove', draw);
        mainCanvas.addEventListener('mouseup', stopDrawing);
        mainCanvas.addEventListener('mouseleave', stopDrawing);

        // Touch support for mobile devices
        mainCanvas.addEventListener('touchstart', (e) => {
            const touch = e.touches[0];
            const mouseEvent = new MouseEvent('mousedown', {
                clientX: touch.clientX,
                clientY: touch.clientY
            });
            mainCanvas.dispatchEvent(mouseEvent);
        });
        mainCanvas.addEventListener('touchmove', (e) => {
            const touch = e.touches[0];
            const mouseEvent = new MouseEvent('mousemove', {
                clientX: touch.clientX,
                clientY: touch.clientY
            });
            mainCanvas.dispatchEvent(mouseEvent);
        });
        mainCanvas.addEventListener('touchend', () => {
            const mouseEvent = new MouseEvent('mouseup', {});
            mainCanvas.dispatchEvent(mouseEvent);
        });

        function getCanvasCoordinates(e) {
            const rect = mainCanvas.getBoundingClientRect();
            const scaleX = mainCanvas.width / rect.width;
            const scaleY = mainCanvas.height / rect.height;
            return {
                x: (e.clientX - rect.left) * scaleX,
                y: (e.clientY - rect.top) * scaleY
            };
        }

        function startDrawing(e) {
            if (activeBlockKey === 'final' && currentTool !== 'baren') {
                showToast("完成画ビューです。版木タグを選択して刻むか、馬連を使用してください。");
                return;
            }
            isDrawing = true;
            const coords = getCanvasCoordinates(e);
            lastX = coords.x;
            lastY = coords.y;
            performToolAction(coords.x, coords.y, true);
        }

        function draw(e) {
            const coords = getCanvasCoordinates(e);
            document.getElementById('pos-display').innerText = `X: ${Math.round(coords.x)}, Y: ${Math.round(coords.y)}`;

            // Update baren cursor overlay position
            const barenOverlay = document.getElementById('baren-cursor-overlay');
            if (currentTool === 'baren') {
                const rect = mainCanvas.getBoundingClientRect();
                barenOverlay.style.left = `${e.clientX - rect.left}px`;
                barenOverlay.style.top = `${e.clientY - rect.top}px`;
            }

            if (!isDrawing) return;
            performToolAction(coords.x, coords.y, false);
        }

        function stopDrawing() {
            isDrawing = false;
        }

        function performToolAction(x, y, isStart) {
            if (currentTool === 'baren') {
                // Apply Baren pressure onto active block or all blocks if on final
                playSound('baren');
                const keysToApply = activeBlockKey === 'final' ? Object.keys(blocks) : [activeBlockKey];
                
                keysToApply.forEach(key => {
                    const bCtx = blocks[key].barenCtx;
                    bCtx.fillStyle = '#ffffff';
                    bCtx.beginPath();
                    bCtx.arc(x, y, toolSize * 2, 0, Math.PI * 2);
                    bCtx.fill();
                });

                renderView();
                return;
            }

            // Otherwise carving or rolling ink on a specific block
            if (activeBlockKey === 'final') return;

            const block = blocks[activeBlockKey];
            const ctx = block.ctx;

            ctx.save();
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            if (currentTool === 'roller') {
                // Apply ink to block
                ctx.globalCompositeOperation = 'source-over';
                ctx.strokeStyle = currentColor;
                ctx.lineWidth = toolSize * 2;
                ctx.beginPath();
                ctx.moveTo(lastX, lastY);
                ctx.lineTo(x, y);
                ctx.stroke();
            } else {
                // Carve out wood (Destination-Out cuts away wood block material)
                playSound('carve');
                ctx.globalCompositeOperation = 'destination-out';

                if (currentTool === 'v_gouge') {
                    // Sharp angular V-gouge
                    ctx.lineWidth = toolSize;
                    ctx.strokeStyle = 'rgba(0,0,0,1)';
                    ctx.beginPath();
                    ctx.moveTo(lastX, lastY);
                    ctx.lineTo(x, y);
                    ctx.stroke();
                } else if (currentTool === 'round_gouge') {
                    // Smooth round gouge stroke
                    ctx.lineWidth = toolSize * 2.5;
                    ctx.strokeStyle = 'rgba(0,0,0,1)';
                    ctx.beginPath();
                    ctx.moveTo(lastX, lastY);
                    ctx.lineTo(x, y);
                    ctx.stroke();
                } else if (currentTool === 'flat_chisel') {
                    // Flat wide square cut
                    ctx.lineWidth = toolSize * 4;
                    ctx.lineCap = 'square';
                    ctx.strokeStyle = 'rgba(0,0,0,1)';
                    ctx.beginPath();
                    ctx.moveTo(lastX, lastY);
                    ctx.lineTo(x, y);
                    ctx.stroke();
                } else if (currentTool === 'kiri_chisel') {
                    // Ultra fine cutting knife mark
                    ctx.lineWidth = Math.max(1, toolSize * 0.5);
                    ctx.strokeStyle = 'rgba(0,0,0,1)';
                    ctx.beginPath();
                    ctx.moveTo(lastX, lastY);
                    ctx.lineTo(x, y);
                    ctx.stroke();
                }
            }

            ctx.restore();
            lastX = x;
            lastY = y;

            renderView();
        }

        function renderView() {
            mainCtx.clearRect(0, 0, width, height);

            if (activeBlockKey !== 'final') {
                // Show single block editing view (Woodblock perspective)
                // 1. Draw Wood Background Grain Texture
                drawWoodBackground(mainCtx);

                // 2. Draw current block's carved wood layer
                const block = blocks[activeBlockKey];
                mainCtx.drawImage(block.canvas, 0, 0);

                // Overlay carving hint text
                mainCtx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                mainCtx.font = '14px Shippori Mincho';
                mainCtx.fillText(`[ 版刻モード: ${block.name} ] 削った白部分が紙に染まりません`, 20, 30);
            } else {
                // SHOW FINAL JAPANESE WASHI PRINT COMPOSITION
                // 1. Base Washi Paper
                drawWashiPaperBackground(mainCtx);

                // 2. Multi-layer Ukiyo-e Printing (Composite blocks with Baren pressure & Bleed)
                const bleedAmount = parseInt(document.getElementById('param-bleed')?.value || 2);
                
                Object.keys(blocks).forEach(key => {
                    const block = blocks[key];

                    // Temporary canvas to calculate baren rubbing opacity transfer
                    const tempCanvas = document.createElement('canvas');
                    tempCanvas.width = width;
                    tempCanvas.height = height;
                    const tempCtx = tempCanvas.getContext('2d');

                    // Draw ink block
                    tempCtx.drawImage(block.canvas, 0, 0);

                    // Mask by baren pressure
                    tempCtx.globalCompositeOperation = 'destination-in';
                    tempCtx.drawImage(block.barenCanvas, 0, 0);

                    // Composite onto final paper using realistic Japanese ink multiply
                    mainCtx.save();
                    mainCtx.globalCompositeOperation = 'multiply';
                    mainCtx.globalAlpha = 0.88;

                    // Slight ink bleed blur shift
                    if (bleedAmount > 0) {
                        mainCtx.filter = `blur(${bleedAmount * 0.3}px)`;
                    }

                    mainCtx.drawImage(tempCanvas, 0, 0);
                    mainCtx.restore();
                });

                // 3. Wood Grain Overlay Effect onto paper
                drawWoodGrainOverlay(mainCtx);

                // 4. Hanko Red Seal Stamp if enabled
                if (showHanko) {
                    drawHankoSeal(mainCtx, width - 70, height - 90);
                }
            }
        }

        function drawWoodBackground(ctx) {
            ctx.fillStyle = '#996035';
            ctx.fillRect(0, 0, width, height);
            
            // Wood rings texture generator
            ctx.fillStyle = 'rgba(62, 34, 23, 0.12)';
            for (let i = 0; i < height; i += 8) {
                const wave = Math.sin(i * 0.03) * 12;
                ctx.fillRect(0, i + wave, width, 3);
            }
        }

        function drawWashiPaperBackground(ctx) {
            ctx.fillStyle = '#f7f4ea';
            ctx.fillRect(0, 0, width, height);

            // Paper fibers noise
            ctx.fillStyle = 'rgba(140, 124, 109, 0.05)';
            for (let i = 0; i < 400; i++) {
                const rx = Math.random() * width;
                const ry = Math.random() * height;
                const rw = Math.random() * 8 + 2;
                const rh = Math.random() * 2 + 1;
                ctx.fillRect(rx, ry, rw, rh);
            }
        }

        function drawWoodGrainOverlay(ctx) {
            const grainIntensity = parseInt(document.getElementById('param-grain')?.value || 30) / 100;
            if (grainIntensity <= 0) return;

            ctx.save();
            ctx.globalCompositeOperation = 'overlay';
            ctx.globalAlpha = grainIntensity * 0.35;

            ctx.fillStyle = '#000000';
            for (let y = 0; y < height; y += 4) {
                if (Math.sin(y * 0.05) > 0.2) {
                    ctx.fillRect(0, y, width, 1.5);
                }
            }
            ctx.restore();
        }

        function drawHankoSeal(ctx, x, y) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(-0.05);

            // Stamp border box
            ctx.strokeStyle = '#c03529';
            ctx.lineWidth = 3;
            ctx.strokeRect(0, 0, 42, 42);

            // Stamp text
            ctx.fillStyle = '#c03529';
            ctx.font = 'bold 16px "Yuji Syuku", serif';
            ctx.fillText('木版', 6, 20);
            ctx.fillText('極印', 6, 36);

            ctx.restore();
        }

        function loadPreset(name) {
            const presets = {
                fuji: 'https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?w=800&q=80',
                wave: 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=800&q=80',
                cat: 'https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=800&q=80'
            };

            const img = new Image();
            img.crossOrigin = 'Anonymous';
            img.onload = () => {
                loadedSourceImage = img;
                if (currentMode === 'convert') {
                    processPhotoWoodcut();
                } else {
                    // Draw directly on sumi block as reference
                    const ctx = blocks.sumi.ctx;
                    ctx.drawImage(img, 0, 0, width, height);
                    renderView();
                }
                showToast(`原画「${name}」を読み込みました`);
            };
            img.src = presets[name];
        }

        function handleImageUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    loadedSourceImage = img;
                    processPhotoWoodcut();
                    showToast("カスタム画像をアップロードし木版画分解を行いました");
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        function processPhotoWoodcut() {
            if (!loadedSourceImage) {
                // If no image, load default Fuji
                loadPreset('fuji');
                return;
            }

            showToast("木版画分解を計算中...");

            // Temporary source canvas for image pixel extraction
            const srcCanvas = document.createElement('canvas');
            srcCanvas.width = width;
            srcCanvas.height = height;
            const srcCtx = srcCanvas.getContext('2d');

            // Draw image scaled to fill
            srcCtx.drawImage(loadedSourceImage, 0, 0, width, height);
            const imgData = srcCtx.getImageData(0, 0, width, height);
            const data = imgData.data;

            const contourThresh = parseInt(document.getElementById('param-contour').value);
            const colorNum = parseInt(document.getElementById('param-colors').value);
            const carveDepth = parseInt(document.getElementById('param-carve-depth').value);

            // 1. Extract Keyblock Lineart (主版 - 墨線) using Sobel Edge Filter
            const sumiCtx = blocks.sumi.ctx;
            sumiCtx.clearRect(0, 0, width, height);
            sumiCtx.fillStyle = '#1c1b1a';

            const edgeData = new Uint8ClampedArray(width * height);
            
            for (let y = 1; y < height - 1; y++) {
                for (let x = 1; x < width - 1; x++) {
                    const idx = (y * width + x) * 4;
                    
                    // Grayscale intensity
                    const lum = data[idx] * 0.299 + data[idx + 1] * 0.587 + data[idx + 2] * 0.114;
                    const lumRight = data[idx + 4] * 0.299 + data[idx + 5] * 0.587 + data[idx + 6] * 0.114;
                    const lumDown = data[((y + 1) * width + x) * 4] * 0.299 + data[((y + 1) * width + x) * 4 + 1] * 0.587 + data[((y + 1) * width + x) * 4 + 2] * 0.114;

                    const diff = Math.abs(lum - lumRight) + Math.abs(lum - lumDown);
                    if (diff > (110 - contourThresh)) {
                        edgeData[y * width + x] = 255; // Line outline
                    }
                }
            }

            // Draw Sobel outlines to Sumi block
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    if (edgeData[y * width + x] === 255) {
                        sumiCtx.fillRect(x, y, 1.8, 1.8);
                    }
                }
            }

            // 2. Color Block Separation (色版分解: 朱, 藍, 鶯)
            const palette = [
                { key: 'color1', hex: '#c03529', r: 192, g: 53, b: 41 },  // 朱
                { key: 'color2', hex: '#1b365d', r: 27, g: 54, b: 93 },   // 藍
                { key: 'color3', hex: '#5b6b44', r: 91, g: 107, b: 68 }   // 鶯
            ];

            // Reset color blocks
            palette.forEach(p => {
                const ctx = blocks[p.key].ctx;
                ctx.clearRect(0, 0, width, height);
            });

            // Map image colors into distinct quantized Ukiyo-e woodblock layers
            for (let y = 0; y < height; y += 2) {
                for (let x = 0; x < width; x += 2) {
                    const idx = (y * width + x) * 4;
                    const r = data[idx];
                    const g = data[idx + 1];
                    const b = data[idx + 2];

                    // Find closest color block in palette
                    let minDist = Infinity;
                    let closest = null;

                    palette.slice(0, colorNum - 1).forEach(p => {
                        const dist = Math.hypot(r - p.r, g - p.g, b - p.b);
                        if (dist < minDist) {
                            minDist = dist;
                            closest = p;
                        }
                    });

                    // Add woodcut gouge chisel jitter noise if threshold met
                    if (closest && minDist < 160) {
                        const ctx = blocks[closest.key].ctx;
                        ctx.fillStyle = closest.hex;

                        // Add carved texture edge roughness
                        const noise = Math.random() * carveDepth > 20 ? 0 : 2;
                        ctx.fillRect(x, y, 2 + noise, 2 + noise);
                    }
                }
            }

            // Ensure all Baren rub layers are fully pressed for Photo mode preview
            Object.keys(blocks).forEach(key => {
                const bCtx = blocks[key].barenCtx;
                bCtx.fillStyle = '#ffffff';
                bCtx.fillRect(0, 0, width, height);
            });

            // Switch to final view and render
            activeBlockKey = 'final';
            updateActiveTabUI();
            renderView();
            showToast("浮世絵木版画への分解が完了しました");
        }

        function switchMode(mode) {
            currentMode = mode;
            const carveBtn = document.getElementById('mode-carve-btn');
            const convertBtn = document.getElementById('mode-convert-btn');
            const carveControls = document.getElementById('carve-controls');
            const convertControls = document.getElementById('convert-controls');

            if (mode === 'carve') {
                carveBtn.className = "px-4 py-1.5 rounded-lg text-sm font-semibold transition-all flex items-center gap-2 bg-wood-700 text-white shadow";
                convertBtn.className = "px-4 py-1.5 rounded-lg text-sm font-semibold transition-all flex items-center gap-2 text-wood-400 hover:text-white";
                carveControls.classList.remove('hidden');
                convertControls.classList.add('hidden');
                showToast("手彫り刷りモード: 彫刻刀で木版を削りましょう");
            } else {
                convertBtn.className = "px-4 py-1.5 rounded-lg text-sm font-semibold transition-all flex items-center gap-2 bg-wood-700 text-white shadow";
                carveBtn.className = "px-4 py-1.5 rounded-lg text-sm font-semibold transition-all flex items-center gap-2 text-wood-400 hover:text-white";
                convertControls.classList.remove('hidden');
                carveControls.classList.add('hidden');
                processPhotoWoodcut();
            }
        }

        function selectBlock(key) {
            activeBlockKey = key;
            updateActiveTabUI();

            const statusText = document.getElementById('current-status-text');
            if (key === 'final') {
                statusText.innerHTML = `<i class="fa-solid fa-eye"></i> 完成図プレビュー: すべての版木と和紙の重ね刷り結果`;
            } else {
                statusText.innerHTML = `<i class="fa-solid fa-cut"></i> ${blocks[key].name} を編集中: 彫刻刀で白い箇所を削り出します`;
            }

            renderView();
        }

        function updateActiveTabUI() {
            document.querySelectorAll('.block-tab').forEach(tab => {
                tab.className = "block-tab px-3 py-1 rounded-md text-xs font-medium text-wood-300 hover:bg-wood-800 transition whitespace-nowrap";
            });

            const activeTab = document.getElementById(`tab-${activeBlockKey}`);
            if (activeTab) {
                activeTab.className = "block-tab px-3 py-1 rounded-md text-xs font-bold bg-yamabuki text-wood-900 shadow transition whitespace-nowrap";
            }
        }

        function setTool(tool) {
            currentTool = tool;
            document.querySelectorAll('.tool-btn').forEach(btn => {
                btn.classList.remove('border-yamabuki', 'text-white', 'bg-wood-700');
                btn.classList.add('border-wood-700', 'text-wood-300');
            });

            const activeBtn = document.getElementById(`tool-${tool}`);
            if (activeBtn) {
                activeBtn.classList.remove('border-wood-700', 'text-wood-300');
                activeBtn.classList.add('border-yamabuki', 'text-white', 'bg-wood-700');
            }

            const barenOverlay = document.getElementById('baren-cursor-overlay');
            if (tool === 'baren') {
                mainCanvas.className = "washi-texture shadow-inner cursor-baren";
                barenOverlay.classList.remove('hidden');
                showToast("馬連モード: キャンバス上をドラッグして紙にインクを摩擦密着させます");
            } else {
                mainCanvas.className = "washi-texture shadow-inner cursor-chisel";
                barenOverlay.classList.add('hidden');
            }
        }

        function updateToolSize(val) {
            toolSize = parseInt(val);
            document.getElementById('tool-size-val').innerText = `${val} px`;
        }

        function setColor(hex, name) {
            currentColor = hex;
            colorName = name;

            document.querySelectorAll('.color-btn').forEach(btn => {
                btn.classList.remove('border-white', 'scale-105');
            });

            // If in carve mode and user selected ink roller, set current block color
            if (activeBlockKey !== 'final') {
                blocks[activeBlockKey].color = hex;
            }

            showToast(`インク色: ${name} に切り替えました`);
        }

        function autoFillInk() {
            if (activeBlockKey === 'final') {
                showToast("版木を選択してください");
                return;
            }
            const ctx = blocks[activeBlockKey].ctx;
            ctx.fillStyle = currentColor;
            ctx.fillRect(0, 0, width, height);
            renderView();
            showToast(`${blocks[activeBlockKey].name} に ${colorName} インクを塗り直しました`);
        }

        function clearCurrentBlock() {
            if (activeBlockKey === 'final') return;
            const ctx = blocks[activeBlockKey].ctx;
            ctx.fillStyle = blocks[activeBlockKey].color;
            ctx.fillRect(0, 0, width, height);
            renderView();
            showToast(`${blocks[activeBlockKey].name} の彫り込みを初期化しました`);
        }

        function updateWashiTexture() {
            const washiType = document.getElementById('washi-type').value;
            renderView();
            showToast(`和紙の種類を [${washiType}] に変更しました`);
        }

        function toggleHankoSeal() {
            showHanko = !showHanko;
            const btn = document.getElementById('hanko-btn');
            btn.innerHTML = showHanko ? 
                '<span class="hanko-seal text-[9px]">極</span> 落款印 ON' : 
                '<span class="text-wood-500">落款印 OFF</span>';
            renderView();
        }

        function resetZoom() {
            mainCanvas.style.transform = 'scale(1)';
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-msg');
            toastMsg.innerText = msg;
            toast.classList.remove('opacity-0');
            toast.classList.add('opacity-100');

            clearTimeout(window.toastTimer);
            window.toastTimer = setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0');
            }, 3000);
        }

        function downloadArtwork() {
            // Ensure render is on final view canvas
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = width;
            tempCanvas.height = height;
            const tempCtx = tempCanvas.getContext('2d');

            // Draw full composition to export canvas
            activeBlockKey = 'final';
            renderView();

            tempCtx.drawImage(mainCanvas, 0, 0);

            // Export PNG
            const link = document.createElement('a');
            link.download = `mokuhanga_print_${Date.now()}.png`;
            link.href = mainCanvas.toDataURL('image/png');
            link.click();
            showToast("完成木版画をPNGファイルとして保存しました！");
        }

        // Initialize application on window load
        window.onload = function() {
            loadPreset('fuji');
        };
    </script>
</body>
</html>
